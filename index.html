<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Laser-Hand-Tracker
    by Liliane ML Burkhard
    2026
  -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANDTRACKER - Hand Laser Art</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan:    #00f5ff;
    --magenta: #ff00e5;
    --yellow:  #ffe600;
    --bg:      #050810;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
  }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  #video {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }

  #defaultCanvas0 {
    position: absolute !important;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* ── HUD ── */
  #hud {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 10;
  }
  .corner {
    position: absolute;
    width: 36px; height: 36px;
    border-color: var(--cyan); border-style: solid; opacity: 0.5;
  }
  .corner-tl { top:18px;left:18px;    border-width:2px 0 0 2px; }
  .corner-tr { top:18px;right:18px;   border-width:2px 2px 0 0; }
  .corner-bl { bottom:18px;left:18px; border-width:0 0 2px 2px; }
  .corner-br { bottom:18px;right:18px;border-width:0 2px 2px 0; }

  #title {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', monospace;
    font-size: clamp(10px, 1.6vw, 18px); font-weight: 700;
    letter-spacing: 0.35em; color: var(--cyan); white-space: nowrap;
    text-shadow: 0 0 14px var(--cyan), 0 0 28px var(--cyan);
    text-transform: uppercase;
  }

  #status {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: clamp(9px, 1.1vw, 13px); letter-spacing: 0.2em;
    color: var(--cyan); opacity: 0.7; white-space: nowrap; transition: color 0.4s;
  }

  #badge-left, #badge-right {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-family: 'Orbitron', monospace; font-size: clamp(8px, 1vw, 11px);
    letter-spacing: 0.15em; padding: 4px 10px; border: 1px solid;
    text-transform: uppercase; opacity: 0; transition: opacity 0.3s;
  }
  #badge-left  { left:22px;  border-color:var(--cyan);    color:var(--cyan);    text-shadow:0 0 8px var(--cyan); }
  #badge-right { right:22px; border-color:var(--magenta); color:var(--magenta); text-shadow:0 0 8px var(--magenta); }
  #badge-left.visible, #badge-right.visible { opacity: 0.8; }

  /* touch indicator */
  #touch-label {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', monospace; font-size: clamp(9px, 1.2vw, 13px);
    letter-spacing: 0.3em; color: var(--yellow); white-space: nowrap;
    text-shadow: 0 0 12px var(--yellow), 0 0 24px var(--yellow);
    opacity: 0; transition: opacity 0.12s;
    text-transform: uppercase; pointer-events: none;
  }
  #touch-label.active { opacity: 1; }

  #scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
    );
  }

  /* ── loader ── */
  #loader {
    position: absolute; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); gap: 20px; transition: opacity 0.8s;
  }
  #loader.fade-out { opacity: 0; pointer-events: none; }

  #loader-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 4vw, 48px); font-weight: 900;
    letter-spacing: 0.4em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }
  #loader-sub {
    font-size: clamp(10px, 1.2vw, 14px); letter-spacing: 0.3em;
    color: var(--magenta); text-shadow: 0 0 10px var(--magenta);
    animation: pulse 2s ease-in-out infinite 0.3s;
  }
  #loader-bar-wrap {
    width: clamp(180px, 30vw, 320px); height: 2px;
    background: rgba(0,245,255,0.15); overflow: hidden;
  }
  #loader-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    width: 0%; transition: width 0.4s ease; box-shadow: 0 0 8px var(--cyan);
  }
  #loader-msg {
    font-size: clamp(9px, 1vw, 12px); letter-spacing: 0.2em;
    color: var(--cyan); opacity: 0.6; min-height: 1em;
  }

  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.55; }
  }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline autoplay muted></video>

  <div id="hud">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div id="title">HANDTRACKER</div>
    <div id="touch-label">✦ CONTACT ✦</div>
    <div id="badge-left">◀ L</div>
    <div id="badge-right">R ▶</div>
    <div id="status">INITIALIZING…</div>
  </div>

  <div id="scanlines"></div>

  <div id="loader">
    <div id="loader-title">Handtracker</div>
    <div id="loader-sub">LASER STRING INTERFACE</div>
    <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
    <div id="loader-msg">LOADING SYSTEMS…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ─── loader ───────────────────────────────────────────────────────────────────
const loaderBar = document.getElementById('loader-bar');
const loaderMsg = document.getElementById('loader-msg');
const loaderEl  = document.getElementById('loader');

function setLoad(pct, msg) {
  loaderBar.style.width = pct + '%';
  loaderMsg.textContent = msg;
}
function hideLoader() {
  loaderEl.classList.add('fade-out');
  setTimeout(() => loaderEl.style.display = 'none', 900);
}
setLoad(10, 'LOADING MEDIAPIPE…');

// ─── shared state ─────────────────────────────────────────────────────────────
const state = { hands: [], videoEl: document.getElementById('video'), ready: false };

// ─── MediaPipe ────────────────────────────────────────────────────────────────
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.6 });
hands.onResults(results => {
  state.hands = [];
  if (results.multiHandLandmarks) {
    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
      state.hands.push({ handedness: results.multiHandedness[i].label, landmarks: results.multiHandLandmarks[i] });
    }
  }
});
setLoad(40, 'REQUESTING CAMERA…');

// ─── camera ───────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false,
    });
    state.videoEl.srcObject = stream;
    await state.videoEl.play();
    setLoad(70, 'CALIBRATING MODEL…');
    const cam = new Camera(state.videoEl, {
      onFrame: async () => { await hands.send({ image: state.videoEl }); },
      width: 1280, height: 720,
    });
    cam.start();
    setLoad(90, 'LAUNCHING INTERFACE…');
    setTimeout(() => { state.ready = true; setLoad(100, 'READY'); setTimeout(hideLoader, 400); }, 600);
  } catch(e) {
    loaderMsg.textContent = 'CAMERA ACCESS DENIED — PLEASE ALLOW CAMERA';
    loaderMsg.style.color = '#ff00e5';
    console.error(e);
  }
}

// ─── constants ────────────────────────────────────────────────────────────────
const FINGERTIPS  = [4, 8, 12, 16, 20];
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

// One distinct laser color per beam (thumb→pinky)
const BEAM_COLORS = [
  { r:0,   g:245, b:255 },  // thumb  — cyan
  { r:255, g:0,   b:229 },  // index  — magenta
  { r:255, g:230, b:0   },  // middle — yellow
  { r:0,   g:245, b:255 },  // ring   — cyan
  { r:255, g:0,   b:229 },  // pinky  — magenta
];

const TOUCH_THRESH_PX = 42;  // pixel distance that counts as a touch

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const statusEl   = document.getElementById('status');
const badgeLeft  = document.getElementById('badge-left');
const badgeRight = document.getElementById('badge-right');
const touchLabel = document.getElementById('touch-label');

// ─── p5 sketch ────────────────────────────────────────────────────────────────
new p5(function(p) {
  let frame = 0;

  // Position lag-filters for each fingertip pair
  const smoothL = Array.from({length:5}, () => ({x:0, y:0}));
  const smoothR = Array.from({length:5}, () => ({x:0, y:0}));
  let hasInit   = false;

  // ── Particle pool ────────────────────────────────────────────────────────────
  const particles = [];
  const PARTICLE_LIFE = 55;

  function spawnExplosion(x, y, col, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.2 + Math.random() * 5.8;
      const white = Math.random() > 0.55;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: PARTICLE_LIFE,
        maxLife: PARTICLE_LIFE,
        size: 1.8 + Math.random() * 3.2,
        r: white ? 255 : col.r,
        g: white ? 255 : col.g,
        b: white ? 255 : col.b,
        trail: [],
      });
    }
  }

  function updateParticles(ctx) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];

      // Record trail
      pt.trail.push({x: pt.x, y: pt.y});
      if (pt.trail.length > 7) pt.trail.shift();

      // Physics
      pt.x  += pt.vx;
      pt.y  += pt.vy;
      pt.vx *= 0.90;
      pt.vy *= 0.90;
      pt.vy += 0.10;   // soft gravity
      pt.life--;

      const t   = pt.life / pt.maxLife;   // 1 → 0
      const alp = t * t;                   // quadratic fade

      ctx.save();

      // Trail line
      if (pt.trail.length > 1) {
        ctx.globalAlpha = alp * 0.35;
        ctx.strokeStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
        ctx.lineWidth   = pt.size * 0.45;
        ctx.shadowBlur  = 8;
        ctx.shadowColor = `rgb(${pt.r},${pt.g},${pt.b})`;
        ctx.lineCap     = 'round';
        ctx.beginPath();
        ctx.moveTo(pt.trail[0].x, pt.trail[0].y);
        for (let j = 1; j < pt.trail.length; j++) ctx.lineTo(pt.trail[j].x, pt.trail[j].y);
        ctx.stroke();
      }

      // Core dot
      ctx.globalAlpha = alp;
      ctx.shadowBlur  = 14 * t;
      ctx.shadowColor = `rgb(${pt.r},${pt.g},${pt.b})`;
      ctx.fillStyle   = `rgb(${pt.r},${pt.g},${pt.b})`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * t, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  // ── Touch state (per fingertip pair) ─────────────────────────────────────
  const wasTouching = [false, false, false, false, false];
  let anyTouching   = false;

  // ── Laser beam — 3-pass renderer ─────────────────────────────────────────
  //  Pass 1: wide atmospheric halo
  //  Pass 2: medium focused glow
  //  Pass 3: razor white core
  function drawLaser(ctx, x1, y1, x2, y2, col, intensity) {
    const { r, g, b } = col;
    const cs = `rgb(${r},${g},${b})`;

    // Pass 1 — halo
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.10 + intensity * 0.12})`;
    ctx.lineWidth   = 22 + intensity * 16;
    ctx.shadowBlur  = 48; ctx.shadowColor = cs;
    ctx.lineCap     = 'round'; ctx.stroke();
    ctx.restore();

    // Pass 2 — glow body
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.60 + intensity * 0.30})`;
    ctx.lineWidth   = 3.0 + intensity * 2.5;
    ctx.shadowBlur  = 22; ctx.shadowColor = cs;
    ctx.lineCap     = 'round'; ctx.stroke();
    ctx.restore();

    // Pass 3 — bright core
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = `rgba(255,255,255,${0.88 + intensity * 0.12})`;
    ctx.lineWidth   = 1.1;
    ctx.shadowBlur  = 6; ctx.shadowColor = '#ffffff';
    ctx.lineCap     = 'round'; ctx.stroke();
    ctx.restore();
  }

  // ── Flash ring drawn on first contact frame ───────────────────────────────
  function drawContactFlash(ctx, x, y, col) {
    const { r, g, b } = col;
    // inner burst ring
    ctx.save();
    ctx.globalAlpha   = 0.85;
    ctx.strokeStyle   = `rgb(${r},${g},${b})`;
    ctx.lineWidth     = 2.5;
    ctx.shadowBlur    = 50;
    ctx.shadowColor   = `rgb(${r},${g},${b})`;
    ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    // outer thin ring
    ctx.save();
    ctx.globalAlpha   = 0.4;
    ctx.strokeStyle   = '#ffffff';
    ctx.lineWidth     = 1;
    ctx.shadowBlur    = 20;
    ctx.shadowColor   = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ── Skeleton ──────────────────────────────────────────────────────────────
  function drawSkeleton(ctx, lm, hexColor) {
    ctx.save();
    ctx.shadowBlur  = 8; ctx.shadowColor = hexColor;
    ctx.strokeStyle = hexColor + '55'; ctx.lineWidth = 1.2;
    for (const [a, b] of CONNECTIONS) {
      ctx.beginPath();
      ctx.moveTo(lx(lm[a]), ly(lm[a]));
      ctx.lineTo(lx(lm[b]), ly(lm[b]));
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── Landmark dots ─────────────────────────────────────────────────────────
  function drawLandmarks(ctx, lm) {
    for (let i = 0; i < lm.length; i++) {
      const x = lx(lm[i]), y = ly(lm[i]);
      const isTip = FINGERTIPS.includes(i);
      const r     = isTip ? 6 : 3.5;
      const col   = hslToRgb((frame * 0.4 + i * 18) % 360, 100, 70);

      ctx.save();
      ctx.shadowBlur  = isTip ? 22 : 10;
      ctx.shadowColor = `rgb(${col})`;
      ctx.fillStyle   = isTip ? `rgb(${col})` : 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();

      if (isTip) {
        const ring = (frame * 0.03 + i * 0.4) % 1;
        ctx.globalAlpha = 1 - ring;
        ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 1; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(x, y, r + ring * 18, 0, Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Dim cross-web ─────────────────────────────────────────────────────────
  function drawCrossWeb(ctx, lmL, lmR) {
    const PTS = [0, 5, 9, 13, 17];
    ctx.save();
    ctx.globalAlpha = 0.08; ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 0.5;
    for (const li of PTS) for (const ri of PTS) {
      ctx.beginPath();
      ctx.moveTo(lx(lmL[li]), ly(lmL[li]));
      ctx.lineTo(lx(lmR[ri]), ly(lmR[ri]));
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── Idle orbit ────────────────────────────────────────────────────────────
  function drawIdle(ctx, W, H) {
    const t = frame * 0.012, cx = W/2, cy = H/2;
    const r1 = Math.min(W,H)*0.18, r2 = Math.min(W,H)*0.28, n = 5;
    ctx.save();
    ctx.font      = `${12 + Math.sin(t*1.4)*2}px 'Share Tech Mono',monospace`;
    ctx.fillStyle = `rgba(0,245,255,${0.4+0.3*Math.sin(t)})`;
    ctx.textAlign = 'center';
    ctx.fillText('⬡  RAISE YOUR HANDS  ⬡', cx, cy + r2 + 50);
    for (let i = 0; i < n; i++) {
      const a  = (i/n)*Math.PI*2 + t;
      const x1 = cx+Math.cos(a)*r1, y1 = cy+Math.sin(a)*r1;
      const x2 = cx+Math.cos(a+Math.PI/n)*r2, y2 = cy+Math.sin(a+Math.PI/n)*r2;
      const col = lerpCMY((i/n + t*0.05) % 1);
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.closePath();
      ctx.shadowBlur=16; ctx.shadowColor=col; ctx.strokeStyle=col;
      ctx.globalAlpha=0.25+0.2*Math.sin(t+i); ctx.lineWidth=1; ctx.stroke();
    }
    ctx.restore();
  }

  // ── HUD text ──────────────────────────────────────────────────────────────
  function updateHUD(n) {
    if (n===0) {
      statusEl.textContent='SCANNING FOR HANDS…';
      badgeLeft.classList.remove('visible'); badgeRight.classList.remove('visible');
    } else if (n===1) {
      statusEl.textContent='1 HAND DETECTED — RAISE SECOND HAND';
      const hl = state.hands[0].handedness==='Left';
      badgeLeft.classList.toggle('visible', !hl); badgeRight.classList.toggle('visible', hl);
    } else {
      statusEl.textContent='BOTH HANDS ACTIVE — LASER INTERFACE ENGAGED';
      badgeLeft.classList.add('visible'); badgeRight.classList.add('visible');
    }
  }

  // ── Utils ─────────────────────────────────────────────────────────────────
  function lx(v) { return (1 - v.x) * p.width; }
  function ly(v) { return v.y * p.height; }

  function hslToRgb(h, s, l) {
    s/=100; l/=100;
    const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
    const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    return `${(f(0)*255)|0},${(f(8)*255)|0},${(f(4)*255)|0}`;
  }

  function lerpCMY(t) {
    const c=[[0,245,255],[255,0,229],[255,230,0],[0,245,255]];
    const s=t*(c.length-1), i=Math.floor(s), f=s-i, a=c[i], b=c[i+1];
    return `rgb(${(a[0]+(b[0]-a[0])*f)|0},${(a[1]+(b[1]-a[1])*f)|0},${(a[2]+(b[2]-a[2])*f)|0})`;
  }

  // ── Setup ─────────────────────────────────────────────────────────────────
  p.setup = function() {
    p.createCanvas(p.windowWidth, p.windowHeight).parent('app');
    p.colorMode(p.RGB, 255, 255, 255, 255);
    p.frameRate(60);
  };
  p.windowResized = function() { p.resizeCanvas(p.windowWidth, p.windowHeight); };

  // ── Main draw ─────────────────────────────────────────────────────────────
  p.draw = function() {
    frame++;
    const ctx = p.drawingContext;
    const W = p.width, H = p.height;

    // Mirrored video background
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    if (state.videoEl.readyState >= 2) {
      ctx.globalAlpha = 0.52;
      ctx.drawImage(state.videoEl, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // Dark overlay
    ctx.fillStyle = 'rgba(5,8,16,0.54)';
    ctx.fillRect(0, 0, W, H);

    if (!state.ready || state.hands.length === 0) {
      drawIdle(ctx, W, H);
      updateParticles(ctx);
      updateHUD(0);
      return;
    }

    updateHUD(state.hands.length);

    // Resolve hand sides (mirrored: MediaPipe 'Left' appears on screen right)
    let leftHand = null, rightHand = null;
    for (const h of state.hands) {
      if (h.handedness === 'Left') rightHand = h;
      else                         leftHand  = h;
    }

    // Draw skeletons + joints
    for (const h of state.hands) {
      drawSkeleton(ctx, h.landmarks, h.handedness === 'Left' ? '#00f5ff' : '#ff00e5');
      drawLandmarks(ctx, h.landmarks);
    }

    // Laser beams + touch detection
    anyTouching = false;

    if (leftHand && rightHand) {
      // Stretch factor drives beam intensity (colour shift + thickness)
      const w0 = leftHand.landmarks[0], w1 = rightHand.landmarks[0];
      const stretch = p.constrain(
        Math.hypot(lx(w0)-lx(w1), ly(w0)-ly(w1)) / (W * 0.75), 0, 1
      );

      // Tight lerp coefficient — feel responsive, not elastic
      const LF = 0.40;

      for (let i = 0; i < 5; i++) {
        const lm_l = leftHand.landmarks[FINGERTIPS[i]];
        const lm_r = rightHand.landmarks[FINGERTIPS[i]];

        const tx = lx(lm_l), ty = ly(lm_l);
        const rx = lx(lm_r), ry = ly(lm_r);

        if (!hasInit) { smoothL[i].x=tx; smoothL[i].y=ty; smoothR[i].x=rx; smoothR[i].y=ry; }

        smoothL[i].x += (tx - smoothL[i].x) * LF;
        smoothL[i].y += (ty - smoothL[i].y) * LF;
        smoothR[i].x += (rx - smoothR[i].x) * LF;
        smoothR[i].y += (ry - smoothR[i].y) * LF;

        // ── Touch detection ──────────────────────────────────────────────────
        const dist     = Math.hypot(smoothL[i].x - smoothR[i].x, smoothL[i].y - smoothR[i].y);
        const touching = dist < TOUCH_THRESH_PX;

        if (touching && !wasTouching[i]) {
          const mx = (smoothL[i].x + smoothR[i].x) * 0.5;
          const my = (smoothL[i].y + smoothR[i].y) * 0.5;
          const col = BEAM_COLORS[i];

          // Primary color burst
          spawnExplosion(mx, my, col, 30);
          // White flash particles
          spawnExplosion(mx, my, {r:255,g:255,b:255}, 12);
          // Offset secondary sparks for physicality
          spawnExplosion(mx + (Math.random()-0.5)*24, my + (Math.random()-0.5)*24, col, 10);

          // Immediate contact flash ring
          drawContactFlash(ctx, mx, my, col);
        }
        wasTouching[i] = touching;
        if (touching) anyTouching = true;

        // Draw the laser beam (straight line — no sagging physics)
        drawLaser(ctx, smoothL[i].x, smoothL[i].y, smoothR[i].x, smoothR[i].y, BEAM_COLORS[i], stretch);
      }

      hasInit = true;
      drawCrossWeb(ctx, leftHand.landmarks, rightHand.landmarks);
    } else {
      hasInit = false;
      for (let i = 0; i < 5; i++) wasTouching[i] = false;
    }

    // CONTACT label
    touchLabel.classList.toggle('active', anyTouching);

    // Particles always render on top
    updateParticles(ctx);
  };
});

// ─── boot ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => setTimeout(startCamera, 200));
</script>
</body>
</html>
